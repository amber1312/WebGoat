name: snyk
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Runner info
        run: lscpu | grep -E "Model name|^CPU\(s\)"; free -m | head -2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build
        run: ./mvnw -q -DskipTests install

      # ---- Setup (report separately) ----
      - name: Install Snyk CLI
        run: npm install -g snyk@1.1300.0
      - name: Snyk version
        run: snyk --version

      # ---- Scan step: the 10% rule applies here ----
      - name: snyk test
        run: snyk test --all-projects --json-file-output=snyk-result.json
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Verify scan output
        run: test -s snyk-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: snyk-result
          path: snyk-result.json
