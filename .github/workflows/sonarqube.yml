name: sonarqube
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Runner info
        run: lscpu | grep -E "Model name|^CPU\(s\)"; free -m | head -2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build
        run: ./mvnw -q -DskipTests install

      # ---- Server setup (report separately from scan overhead) ----
      - name: Start SonarQube server
        run: |
          sudo sysctl -w vm.max_map_count=524288
          docker run -d --name sonarqube -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            sonarqube@sha256:f95aaa9016dd4e92c7d70691167a6d96dbb5d8acffd61eba1cb4335d364a7840
      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            s=$(curl -s http://localhost:9000/api/system/status | jq -r .status 2>/dev/null)
            echo "status: $s"
            [ "$s" = "UP" ] && exit 0
            sleep 5
          done
          docker logs sonarqube | tail -50
          exit 1
      - name: Create token and log versions
        run: |
          TOKEN=$(curl -s -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=ci-$RANDOM" | jq -r .token)
          echo "::add-mask::$TOKEN"
          echo "SONAR_TOKEN=$TOKEN" >> $GITHUB_ENV
          curl -s http://localhost:9000/api/server/version; echo
      - name: Pull scanner image
        run: docker pull sonarsource/sonar-scanner-cli@sha256:47956b669bf486bdad919e1cbd0533223515aa0b6d1d31763e5a3754942df6d7

      # ---- Scan step: the 10% rule applies here ----
      - name: sonar scan
        run: |
          docker run --rm --network host -v "$PWD:/usr/src" \
            -e SONAR_TOKEN -e SONAR_HOST_URL=http://localhost:9000 \
            sonarsource/sonar-scanner-cli@sha256:47956b669bf486bdad919e1cbd0533223515aa0b6d1d31763e5a3754942df6d7 \
            -Dsonar.projectKey=webgoat \
            -Dsonar.sources=. \
            -Dsonar.java.binaries='**/target/classes' \
            -Dsonar.exclusions='**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/src/test/**,**/src/it/**,**/static/plugins/**'

      # ---- Server-side processing (add to scan time for total overhead) ----
      - name: Wait for server processing
        run: |
          for i in $(seq 1 200); do
            r=$(curl -s -m 10 -u "$SONAR_TOKEN:" "http://localhost:9000/api/ce/component?component=webgoat")
            q=$(echo "$r" | jq '.queue | length' 2>/dev/null)
            s=$(echo "$r" | jq -r '.current.status // empty' 2>/dev/null)
            echo "queue=$q current=$s"
            if [ "$q" = "0" ] && [ "$s" = "SUCCESS" ]; then exit 0; fi
            if [ "$s" = "FAILED" ] || [ "$s" = "CANCELED" ]; then
              docker logs sonarqube | tail -100
              exit 1
            fi
            sleep 3
          done
          docker logs sonarqube | tail -100
          exit 1

      - name: Export findings
        run: |
          curl -s -u "$SONAR_TOKEN:" "http://localhost:9000/api/issues/search?componentKeys=webgoat&ps=1&facets=types,severities,impactSoftwareQualities" > sonar-summary.json
          curl -s -u "$SONAR_TOKEN:" "http://localhost:9000/api/hotspots/search?project=webgoat&ps=1" > sonar-hotspots.json
          jq '.paging.total' sonar-summary.json sonar-hotspots.json
          p=1
          while :; do
            curl -s -u "$SONAR_TOKEN:" "http://localhost:9000/api/issues/search?componentKeys=webgoat&ps=500&p=$p" > sonar-issues-$p.json
            n=$(jq '.issues | length' sonar-issues-$p.json)
            [ "$n" -lt 500 ] && break
            p=$((p+1))
          done
      - name: Verify scan output
        run: test -s sonar-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: sonar-result
          path: sonar-*.json
